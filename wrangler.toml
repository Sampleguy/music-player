name = "music-player"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "music-player-files"

# App files (HTML/CSS/JS). The Worker code runs first only for these paths.
[assets]
directory = "./app"
run_worker_first = ["/api/*", "/audio/*", "/covers/*", "/lyrics/*"]

# Workers AI (Whisper, free tier: 10k neurons/day) for AI lyrics, B-43.
[ai]
binding = "AI"
remote = true # AI always runs on Cloudflare, even in local dev

# Login rate limit: 5 tries per 60 s per IP (free Workers rate-limit binding).
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
